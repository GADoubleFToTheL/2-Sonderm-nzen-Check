name: App veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Eine kaputte Münzliste wird nicht veröffentlicht.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate.mjs

      # Ist Pages noch nicht aktiviert, schlägt dieser Schritt fehl: dann nur ein Hinweis statt rotem Haken.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome != 'success'
        run: echo "::warning::GitHub Pages ist noch nicht aktiviert (Settings -> Pages -> Source = GitHub Actions). Danach diesen Workflow erneut starten."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
